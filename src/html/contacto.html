<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Gestión</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <aside class="header-principal">
        <img src="../../../assets/logo.svg" alt="Logo" class="header-logo">
        <nav class="menu-nav">
            <a href="index.html" class="menu-link">Menú Principal</a>
            <a href="stock.html" class="menu-link">Stock</a>
            <a href="pedidos.html" class="menu-link">Pedidos</a>
            <a href="caja.html" class="menu-link">Caja</a>
            <a href="perfil.html" class="menu-link">Perfil de usuario</a>
            <a href="contacto.html" class="menu-link activo">Contacto</a>
        </nav>
    </aside>

    <main class="contenedor-principal">
        <header class="cabecera-pagina">
            <h1 class="cabecera-titulo">Contacto</h1>
            <p class="cabecera-fecha" id="fecha-jornada">Jornada de hoy • 23 de julio</p>
        </header>

        <section class="form-card">
            <form id="form-contacto" novalidate>
                <label class="campo-grupo">
                    <input type="text" id="input-nombre" class="campo-input" placeholder="Nombre..." aria-label="Nombre" required>
                    <span class="campo-error"></span>
                </label>

                <label class="campo-grupo">
                    <input type="email" id="input-email" class="campo-input" placeholder="Correo electrónico..." aria-label="Correo electrónico" required>
                    <span class="campo-error"></span>
                </label>

                <label class="campo-grupo">
                    <input type="tel" id="input-telefono" class="campo-input" placeholder="Teléfono (opcional)..." aria-label="Teléfono">
                    <span class="campo-error"></span>
                </label>

                <label class="campo-checkbox">
                    <input type="checkbox" id="input-llamar" name="llamar">
                    Prefiero que me llaméis
                    <span class="campo-error"></span>
                </label>

                <label class="campo-grupo">
                    <select id="input-motivo" class="campo-input" aria-label="Motivo de contacto" required>
                        <option value="">Selecciona un motivo...</option>
                        <option value="Incidencia con un pedido">Incidencia con un pedido</option>
                        <option value="Consulta de stock">Consulta de stock</option>
                        <option value="Problema en caja">Problema en caja</option>
                        <option value="Otro motivo">Otro motivo</option>
                    </select>
                    <span class="campo-error"></span>
                </label>

                <label class="campo-grupo">
                    <textarea id="input-mensaje" class="campo-input" placeholder="Escribe tu mensaje..." aria-label="Mensaje" minlength="10" maxlength="200" rows="4" required></textarea>
                    <span id="contador-caracteres" class="campo-contador">0 / 200 caracteres</span>
                    <span class="campo-error"></span>
                </label>

                <button type="submit" class="boton-principal">Enviar mensaje</button>
            </form>
        </section>

        <h2 class="section-divider-title">Mensajes enviados</h2>
        <section id="lista-mensajes" class="form-card"></section>
    </main>

    <script type="module" src="../js/main.js"></script>
</body>

</html>
