<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja - Gestión</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <aside class="sidebar">
        <img src="../../assets/logo.svg" alt="Logo" class="sidebar-logo">
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Menú Principal</a>
            <a href="stock.html" class="nav-link">Stock</a>
            <a href="pedidos.html" class="nav-link">Pedidos</a>
            <a href="caja.html" class="nav-link active">Caja</a>
            <a href="perfil.html" class="nav-link">Perfil de usuario</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1>Caja</h1>
            <p class="date-info" id="fecha-jornada">Jornada de hoy • 23 de julio</p>
        </header>

        <section class="form-card">
            <h2 id="fecha-caja-hoy">23/07/2026</h2>
            <form id="form-caja">
                <input type="number id="input-tarjeta" class="input-field" placeholder="Pago en tarjeta..."
                    required>
                <input type="number" id="input-efectivo" class="input-field"
                    placeholder="Pago en efectivo..." required>
                <input type="number" id="input-gastos" class="input-field" placeholder="Gastos menores..."
                    required>
                <button type="submit" class="btn-primary">Continuar ▷</button>
            </form>
        </section>
        <h3 class="section-divider-title">Días anteriores</h3>
        <section id="historial-caja"></section>
    </main>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
