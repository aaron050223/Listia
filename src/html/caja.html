<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja - Gestión</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <aside class="header-principal">
        <img src="../../../assets/logo.svg" alt="Logo" class="header-logo">
        <nav class="menu-nav">
            <a href="index.html" class="menu-link">Menú Principal</a>
            <a href="stock.html" class="menu-link">Stock</a>
            <a href="pedidos.html" class="menu-link">Pedidos</a>
            <a href="caja.html" class="menu-link activo">Caja</a>
            <a href="perfil.html" class="menu-link">Perfil de usuario</a>
            <a href="contacto.html" class="menu-link">Contacto</a>
        </nav>
    </aside>

    <main class="contenedor-principal">
        <header class="cabecera-pagina">
            <h1 class="cabecera-titulo">Caja</h1>
            <p class="cabecera-fecha" id="fecha-jornada">Jornada de hoy • 23 de julio</p>
        </header>

        <section class="form-card">
            <h2 id="fecha-caja-hoy">23/07/2026</h2>
            <form id="form-caja">
                <input type="number id="input-tarjeta" class="campo-input" placeholder="Pago en tarjeta..."
                    required>
                <input type="number" id="input-efectivo" class="campo-input"
                    placeholder="Pago en efectivo..." required>
                <input type="number" id="input-gastos" class="campo-input" placeholder="Gastos menores..."
                    required>
                <button type="submit" class="boton-principal">Continuar ▷</button>
            </form>
        </section>
        <h3 class="section-divider-title">Días anteriores</h3>
        <section id="caja-historial"></section>
    </main>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
