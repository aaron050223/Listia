<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - Gestión</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <aside class="sidebar">
        <img src="../../assets/logo.svg" alt="Logo" class="sidebar-logo">
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Menú Principal</a>
            <a href="stock.html" class="nav-link active">Stock</a>
            <a href="pedidos.html" class="nav-link">Pedidos</a>
            <a href="caja.html" class="nav-link">Caja</a>
            <a href="perfil.html" class="nav-link">Perfil de usuario</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1>Stock</h1>
            <p class="date-info" id="fecha-jornada">Jornada de hoy • 23 de julio</p>
        </header>

        <section class="section-card">
            <header class="section-header">
                <h2>Bebida <span id="count-bebida">(4 productos)</span></h2>
                <a class="link-action" id="editar-bebida">Editar grupo</a>
            </header>
            <ul class="product-list" id="lista-bebida">
                <li class="product-item">
                    <span>Coco Cola</span>
                    <span class="product-badge">9</span>
                </li>
                <li class="product-item">
                    <span>Fanta</span>
                    <span class="product-badge">3</span>
                </li>
                <li class="product-item low-stock">
                    <span>Sprite</span>
                    <span class="product-badge">2</span>
                </li>
                <li class="product-item">
                    <span>Fuze Tea</span>
                    <span class="product-badge">7</span>
                </li>
            </ul>
        </section>

        <section class="section-card">
            <header class="section-header">
                <h2>Snacks <span id="count-snacks">(5 productos)</span></h2>
                <a class="link-action" id="editar-snacks">Editar grupo</a>
            </header>
            <ul class="product-list" id="lista-snacks">
                <li class="product-item low-stock">
                    <span>Doritos</span>
                    <span class="product-badge">2</span>
                </li>
                <li class="product-item">
                    <span>3D</span>
                    <span class="product-badge">5</span>
                </li>
                <li class="product-item">
                    <span>Artesanas</span>
                    <span class="product-badge">8</span>
                </li>
                <li class="product-item">
                    <span>Pelotazos</span>
                    <span class="product-badge">6</span>
                </li>
                <li class="product-item">
                    <span>Pringles</span>
                    <span class="product-badge">4</span>
                </li>
            </ul>
        </section>
    </main>

</body>

</html>
