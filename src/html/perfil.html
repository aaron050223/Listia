<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario - Gestión</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <aside class="header-principal">
        <img src="../../../assets/logo.svg" alt="Logo" class="header-logo">
        <nav class="menu-nav">
            <a href="index.html" class="menu-link">Menú Principal</a>
            <a href="stock.html" class="menu-link">Stock</a>
            <a href="pedidos.html" class="menu-link">Pedidos</a>
            <a href="caja.html" class="menu-link">Caja</a>
            <a href="perfil.html" class="menu-link activo">Perfil de usuario</a>
        </nav>
    </aside>

    <main class="contenedor-principal">
        <header class="cabecera-pagina">
            <h1 class="cabecera-titulo">Perfil de usuario</h1>
            <p class="cabecera-fecha" id="fecha-jornada">Jornada de hoy • 23 de julio</p>
        </header>

        <section class="form-card">
            <form id="form-perfil">
                <input type="text" id="input-nombre" class="campo-input" placeholder="Nombre..." required>
                <input type="email" id="input-email" class="campo-input" placeholder="Correo electrónico..." required>
                <input type="password" id="input-password" class="campo-input" placeholder="Contraseña..." required>
                <input type="password" id="input-password-repeat" class="campo-input"
                    placeholder="Repete la contrasñea..." required>
                <input type="date" id="input-fecha" class="campo-input" placeholder="Fecha de nacimiento...">
                <label>
                    <input type="checkbox" name="terminos" required>
                    He leído y acepto
                </label>
                <button type="submit" class="boton-principal">Continuar</button>
            </form>
        </section>
    </main>
    <script type="module" src="../js/main.js"></script>
</body>

</html>
